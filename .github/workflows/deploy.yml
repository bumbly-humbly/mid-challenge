name: Deploy to k3s

# Bonus III. Changing a manifest in main rolls it out to the cluster with no
# manual step, no stored AWS keys and no kubeconfig in GitHub.
on:
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - "scripts/deploy.sh"
      - "scripts/verify-hardening.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # required to mint the OIDC token
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Federated, short-lived credentials. No AWS access key exists in this
      # repository or in this account for CI to use.
      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      - name: Apply manifests over SSM
        id: deploy
        env:
          SERVER_INSTANCE_ID: ${{ vars.SERVER_INSTANCE_ID }}
        run: ./scripts/deploy.sh

      # Bonus I's "automated" half. The hardening is asserted from the public
      # internet, against the host that is actually serving, on every deploy --
      # so a change that quietly drops a control turns the pipeline red instead
      # of going unnoticed until someone runs the README's commands by hand.
      - name: Verify hardening from outside the cluster
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nmap
          ./scripts/verify-hardening.sh "${{ steps.deploy.outputs.ingress_host }}"
