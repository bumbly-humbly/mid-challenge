apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: default
  labels:
    app: hello
spec:
  # A floor of 2, not a fixed count -- the HorizontalPodAutoscaler owns this
  # field once it is running.
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below the current replica count
      maxSurge: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
      annotations:
        # nginx renders the ConfigMap template once, at container start, so a
        # ConfigMap-only change reaches the mounted volume but never the served
        # page -- and `kubectl rollout status` reports success without having
        # rolled anything out. Bumping this forces a real rollout. Kustomize's
        # configMapGenerator does the same thing with a content hash; raw
        # manifests have to say it out loud.
        demo/config-revision: "2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # Task 3, "deployed across multiple nodes". ScheduleAnyway rather than
      # DoNotSchedule so the HPA can still scale past the node count.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: hello
      containers:
        - name: nginx
          # Unprivileged variant: listens on 8080 as UID 101, needs no
          # capabilities at all. Pinned minor version, never :latest.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates
              readOnly: true
          # requests are what the HPA measures against -- without them,
          # CPU-based autoscaling silently does nothing.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nginx-template
          configMap:
            name: hello-nginx-template
