# Task 4: served by an ingress controller that terminates TLS.
#
# Note what is *not* here. No TLS options, no security-header middleware, no
# rate limit, and no second Ingress to redirect plaintext -- yet this route is
# hardened on all four counts. Those controls moved onto the Traefik
# entrypoint in 00-traefik-config.yaml, so they apply to every route on the
# cluster rather than to the routes that remembered to ask.
#
# That is the difference the brief's word "persistent" is pointing at: the
# next Ingress someone adds inherits the hardening automatically, and there is
# no annotation to forget.
#
# __INGRESS_HOST__ is substituted at deploy time from the value Terraform
# wrote to /etc/k3s-demo/env on the server. See scripts/deploy.sh.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-https
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - __INGRESS_HOST__
      secretName: hello-tls # created at boot from the Terraform-generated cert
  rules:
    - host: __INGRESS_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
